name: Monitor Repository Size

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  check-and-clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository (Full History for Size Check)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: gh-pages

      - name: Check Size
        id: check_size
        run: |
          # Calculate .git size in MB
          SIZE_MB=$(du -sk .git | cut -f1 | awk '{print int($1/1024)}')
          echo "Current Repository Size: ${SIZE_MB} MB"
          
          # Threshold: 1000 MB (1GB)
          if [ "$SIZE_MB" -gt 1000 ]; then
            echo "⚠️ Repository size exceeds 1GB limit!"
            echo "needs_cleanup=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Repository size is safe."
            echo "needs_cleanup=false" >> $GITHUB_OUTPUT
          fi

      - name: Prune History (If needed)
        if: steps.check_size.outputs.needs_cleanup == 'true'
        run: |
          echo "🧹 Starting automated cleanup..."
          
          # Config Git
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # Fix RPC 500 error for large pushes
          git config --global http.postBuffer 524288000
          
          # Create Orphan Branch
          git checkout --orphan gh-pages-reset
          
          # Commit current state (files only, no history)
          git commit -m "Auto-Maintenance: Prune history (Size > 1GB)"
          
          # Force Push with detailed updated log
          echo "🚀 Force pushing new history..."
          git push origin +gh-pages-reset:gh-pages
          
          echo "✅ Cleanup complete. History reset."
