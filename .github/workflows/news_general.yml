name: Update News (General)

on:
  push:
    paths:
      - 'backend/channels_crypto.txt'
      - 'backend/channels_history.txt'
      - 'backend/channels_tech.txt'
      - '.github/workflows/news_general.yml'
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes
  workflow_dispatch:

concurrency:
  group: news-general
  cancel-in-progress: false

jobs:
  update-general:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Setup FFmpeg
        uses: federicocarboni/setup-ffmpeg@v2

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Fetch All Categories
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION_GENERAL }}
        run: |
          # 1. Fetch Existing Data (Smart Sync)
          git fetch origin gh-pages || true
          git checkout origin/gh-pages -- news_crypto.json || echo "⚠️ No crypto news found"
          git checkout origin/gh-pages -- news_history.json || echo "⚠️ No history news found"
          git checkout origin/gh-pages -- news_tech.json || echo "⚠️ No tech news found"
          
          # Move them to root if checkout put them there (it usually does with --)
          # fetch_news.py expects them in ../ relative to backend, so in root.
          
          cd backend
          
          echo "🚀 Fetching Crypto..."
          python fetch_news.py --channels channels_crypto.txt --output ../news_crypto.json --limit 50
          
          echo "🚀 Fetching History..."
          python fetch_news.py --channels channels_history.txt --output ../news_history.json --limit 10
          
          echo "🚀 Fetching Tech..."
          python fetch_news.py --channels channels_tech.txt --output ../news_tech.json --limit 20
          
          cd ..

      - name: Deploy to gh-pages
        run: |
          # Strategy: Move artifacts to temp, switch branch, move back.
          mkdir -p /tmp/news_deploy
          
          # Move JSONs
          [ -f news_crypto.json ] && mv news_crypto.json /tmp/news_deploy/
          [ -f news_history.json ] && mv news_history.json /tmp/news_deploy/
          [ -f news_tech.json ] && mv news_tech.json /tmp/news_deploy/
          
          
          # Move Media
          if [ -d "media" ]; then
            mv media /tmp/news_deploy/media
          fi
          
          # Switch Branch
          git fetch origin gh-pages || true
          git checkout gh-pages || git checkout --orphan gh-pages
          git pull origin gh-pages --rebase || true
          
          # Restore
          cp -r /tmp/news_deploy/* .
          
          # Commit
          git config --global user.name 'News Bot'
          git config --global user.email 'bot@noreply.github.com'
          
          git add news_crypto.json news_history.json news_tech.json
          git add media/ || echo "No media folder"
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "✅ Deploying General News..."
            git commit -m "Update General News $(date)"
            git push origin gh-pages
          else
            echo "💤 No changes to deploy."
          fi
