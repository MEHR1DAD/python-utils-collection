name: Network Health Check

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '5/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: net-health
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout System
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Drivers
        run: |
          pip install requests beautifulsoup4

      - name: Run Diagnostics
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python backend/network_health.py

      - name: Save System State
        run: |
          git config --global user.name "System Admin"
          git config --global user.email "admin@system.local"
          git add backend/data/net_status.json backend/data/system_metrics.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update system logs [skip ci]" && git pull --rebase origin main && git push origin main)

      - name: Deploy to Public Shard
        run: |
          # Cache the metrics file
          mkdir -p /tmp/deploy_cache
          cp backend/data/system_metrics.json /tmp/deploy_cache/system_metrics.json || echo "No metrics generated"
          
          # Switch to gh-pages
          git fetch origin gh-pages || true
          git checkout gh-pages || git checkout --orphan gh-pages
          git reset --hard origin/gh-pages || true
          
          # Restore file to ROOT
          cp /tmp/deploy_cache/system_metrics.json ./system_metrics.json
          
          # Commit and Push
          git config --global user.name 'System Admin'
          git config --global user.email 'admin@system.local'
          
          git add system_metrics.json
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "✅ Publishing metrics..."
            git commit -m "Update public metrics $(date)"
            git pull --rebase origin gh-pages
            git push origin gh-pages
          else
            echo "💤 No changes to publish."
          fi
