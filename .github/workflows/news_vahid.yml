name: Update News (Vahid - Priority)

on:
  push:
    paths:
      - 'backend/channels_vahid.txt'
      - '.github/workflows/news_vahid.yml'
  schedule:
    - cron: '*/5 * * * *' # Every 5 minutes (Run Trigger)
  workflow_dispatch:

concurrency:
  group: news-vahid
  cancel-in-progress: false

jobs:
  update-vahid:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Setup FFmpeg
        uses: federicocarboni/setup-ffmpeg@v2

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Continuous Fetch Loop (2x per job)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION_VAHID }}
        run: |
          # Fetch existing news to enable Smart Sync (Incremental Update)
          # This prevents re-downloading heavy videos every time.
          git fetch origin gh-pages || true
          # Checkout directly to root where fetch_news.py expects it (via ../vahid.json from backend)
          git checkout origin/gh-pages -- vahid.json || echo "⚠️ No existing news found (First run?)"
          # Verify file presence for debugging
          ls -la vahid.json || echo "❌ vahid.json NOT FOUND in root"
          
          # Optimization: 2 runs with limit 20 is cleaner for the 5-min slot.
          # Run 1 -> Sleep 120s -> Run 2 -> Finish (Total ~4-5 mins)
          for i in {1..2}; do
            echo "🚀 Starting Run #$i of 2..."
            
            cd backend
            # Output directly to root of repo for easy access via Pages
            python fetch_news.py --channels channels_vahid.txt --output ../vahid.json --limit 20
            cd ..
            
            # Deployment Logic follows below...
            # The script outputs to ../vahid.json (root relative to backend). 
            # If we are in root now, the file is already there.
            
            # We need to ensure the file path matches where Pages will serve it.
            # Let's move files to root 'public' folder or root itself.
            # --- DEPLOYMENT TO GH-PAGES ---
            # Strategy: Move artifact to temp, switch branch, move back.
            # This avoids "untracked file" conflicts during checkout.
            
            # 1. Move generated files to safe temp location
            mkdir -p /tmp/news_deploy
            mv vahid.json /tmp/news_deploy/vahid.json
            if [ -d "media" ]; then
              # Copy media to temp (or move if safe) - moving is faster
              # Copy media to temp (or move if safe) - moving is faster
              # Re-create media dir in temp
              mv media /tmp/news_deploy/media
            fi
            
            # 2. Switch to gh-pages
            git fetch origin gh-pages || true
            git checkout gh-pages || git checkout --orphan gh-pages
            git pull origin gh-pages --rebase || true
            
            # 3. Restore files from temp
            mv /tmp/news_deploy/vahid.json ./vahid.json
            # Sync media: Copy new/changed files
            if [ -d "/tmp/news_deploy/media" ]; then
              mkdir -p media
              cp -r /tmp/news_deploy/media/* media/
            fi
            
            # 4. Commit and Push
            git config --global user.name 'News Bot'
            git config --global user.email 'bot@noreply.github.com'
            
            git add vahid.json
            git add media/ || echo "No media folder found"
            
            if [ -n "$(git status --porcelain)" ]; then
              echo "✅ Deploying to gh-pages..."
              git commit -m "Update News $(date)"
              git push origin gh-pages
            else
              echo "💤 No changes to deploy."
            fi
            
            # 6. Cleanup to keep runner clean (optional but good practice)
            git checkout master || git checkout main
            
            if [ $i -lt 2 ]; then
              echo "⏳ Sleeping for 120 seconds..."
              sleep 120
            fi
          done
