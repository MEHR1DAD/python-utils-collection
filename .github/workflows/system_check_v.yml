name: System Check (V)

on:
  push:
    paths:
      - 'backend/config_v.txt'
      - '.github/workflows/system_check_v.yml'
  schedule:
    - cron: '*/5 * * * *' # Every 5 minutes
  workflow_dispatch:

concurrency:
  group: sys-check-v
  cancel-in-progress: false

jobs:
  check-v:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Setup Environment
        uses: federicocarboni/setup-ffmpeg@v2

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Continuous System Check
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION_VAHID }}
        run: |
          # Fetch existing data shard
          git fetch origin gh-pages || true
          git checkout origin/gh-pages -- data_shard_v.json || echo "⚠️ No existing data found"
          
          # Optimization: 2 runs with limit 20
          for i in {1..2}; do
            echo "🚀 Starting Run #$i of 2..."
            
            cd backend
            # Using main.py as core utility script
            python main.py --channels config_v.txt --output ../data_shard_v.json --limit 20
            cd ..
            
            # --- DEPLOYMENT TO GH-PAGES ---
            mkdir -p /tmp/deploy_cache
            mv data_shard_v.json /tmp/deploy_cache/data_shard_v.json
            if [ -d "media" ]; then
              mv media /tmp/deploy_cache/media
            fi
            
            # Switch to gh-pages
            git fetch origin gh-pages || true
            git checkout gh-pages || git checkout --orphan gh-pages
            git pull origin gh-pages --rebase || true
            
            # Restore
            mv /tmp/deploy_cache/data_shard_v.json ./data_shard_v.json
            if [ -d "/tmp/deploy_cache/media" ]; then
              mkdir -p media
              cp -r /tmp/deploy_cache/media/* media/
            fi
            
            # Commit and Push
            git config --global user.name 'Sys Bot'
            git config --global user.email 'bot@noreply.github.com'
            
            git add data_shard_v.json
            git add media/ || echo "No media folder found"
            
            if [ -n "$(git status --porcelain)" ]; then
              echo "✅ Updating system data..."
              git commit -m "System Update $(date)"
              git push origin gh-pages
            else
              echo "💤 No changes."
            fi
            
            # Cleanup
            git checkout master || git checkout main
            
            if [ $i -lt 2 ]; then
              echo "⏳ Sleeping..."
              sleep 120
            fi
          done
