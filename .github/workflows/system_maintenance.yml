name: System Maintenance

on:
  push:
    paths:
      - 'backend/config_c.txt'
      - 'backend/config_h.txt'
      - 'backend/config_t.txt'
      - 'backend/config_global.txt'
      - '.github/workflows/system_maintenance.yml'
  schedule:
    - cron: '15 * * * *' # Once an hour at minute 15 (00:15, 01:15...) - Prevents overlap with V
  workflow_dispatch:

concurrency:
  group: system-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 1 # Shallow fetch

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Setup Environment
        uses: federicocarboni/setup-ffmpeg@v2

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run Maintenance Tasks
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION_GENERAL }}
        run: |
          # Fetch Existing Data Shards
          # Fetch Existing Data Shards
          git fetch --depth=1 origin gh-pages
          git checkout origin/gh-pages -- data_shard_c.json || echo "⚠️ No existing shard C"
          git checkout origin/gh-pages -- data_shard_h.json || echo "⚠️ No existing shard H"
          git checkout origin/gh-pages -- data_shard_t.json || echo "⚠️ No existing shard T"
          
          cd backend
          
          # Single Run Logic (Removed Loop)
          
          # Task C (Budget: 20m)
          echo "🚀 Processing Shard C..."
          python main.py --channels config_c.txt --output ../data_shard_c.json --limit 50 --max-duration 1200
          
          # Task H (Budget: 5m)
          echo "🚀 Processing Shard H..."
          python main.py --channels config_h.txt --output ../data_shard_h.json --limit 10 --max-duration 300
          
          # Task T (Budget: 10m)
          echo "🚀 Processing Shard T..."
          python main.py --channels config_t.txt --output ../data_shard_t.json --limit 20 --max-duration 600
          
          # Task Global (Budget: 10m)
          echo "🚀 Processing Shard Global..."
          python main.py --channels config_global.txt --output ../data_shard_global.json --limit 20 --max-duration 600

          cd ..

      - name: Sync Data
        if: always() # COMMIT EVEN IF PARTIAL FAILURE
        run: |
          # DEPLOYMENT
          mkdir -p /tmp/deploy_cache
          
          # Move JSONs
          [ -f data_shard_c.json ] && mv data_shard_c.json /tmp/deploy_cache/
          [ -f data_shard_h.json ] && mv data_shard_h.json /tmp/deploy_cache/
          [ -f data_shard_t.json ] && mv data_shard_t.json /tmp/deploy_cache/
          [ -f data_shard_global.json ] && mv data_shard_global.json /tmp/deploy_cache/
          
          # Move Media
          if [ -d "media" ]; then
            # Prune old media (>24h)
            echo "🧹 Pruning media files..."
            find media -type f -mtime +1 -delete
            
            # EMERGENCY SIZE CHECK (Cap at 500MB)
            MEDIA_SIZE=$(du -sm media | cut -f1)
            if [ "$MEDIA_SIZE" -gt 500 ]; then
              echo "⚠️ Media folder is large ($MEDIA_SIZE MB). Aggressive pruning..."
              find media -type f -mtime +0.25 -delete # Older than 6h
            fi
            
            # Second check: If still huge, keep only last hour
            MEDIA_SIZE=$(du -sm media | cut -f1)
            if [ "$MEDIA_SIZE" -gt 800 ]; then
               echo "🚨 STILL TOO BIG ($MEDIA_SIZE MB). Nuke mode..."
               find media -type f -mtime +0.04 -delete # Older than ~1h
            fi
            
            mv media /tmp/deploy_cache/media
          fi
          
          # Switch to gh-pages
          git fetch origin gh-pages || true
          git checkout gh-pages || git checkout --orphan gh-pages
          # Reset to remote state
          git reset --hard origin/gh-pages || true
          
          # Restore
          cp -r /tmp/deploy_cache/* .
          
          # Commit
          git config --global user.name 'Sys Bot'
          git config --global user.email 'bot@noreply.github.com'
          git config --global http.postBuffer 524288000
          
          git add data_shard_c.json data_shard_h.json data_shard_t.json
          git add media/ || echo "No media folder"
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "✅ Syncing System Data..."
            git commit -m "System Maintenance $(date)"
            git pull --rebase origin gh-pages
            git push origin gh-pages
          else
            echo "💤 No changes."
          fi
